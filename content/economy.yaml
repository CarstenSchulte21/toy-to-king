# Geld und Verbrauch (M5a). Beträge in Euro, ganze Zahlen.
start_money: 8

# Taschengeld: einmal die Woche, an einem festen Tag.
allowance:
  day: sa
  amount: 10
  text: "Taschengeld. {amount} € in der Hosentasche."

# Ab dieser Wanted-Stufe verkauft Sibel nur noch, was unauffällig ist.
careful_from_wanted: 2
careful_kinds: [cap, marker]
careful_colors: [farbe_schwarz, farbe_chrom]
careful_text: "Sibel schiebt die bunten Dosen weg. „Nicht diese Woche.\""

# Verbrauch: je benutzter Farbe eine Dose.
paint_per_color: 1

texts:
  bought: "{item} für {price} €."
  too_expensive: "Dafür reicht es nicht."
  no_paint: "Die Farbe ist alle."
  shop_title: "KINGSIZE"
  shop_empty: "Sibel hat gerade nichts für dich."
