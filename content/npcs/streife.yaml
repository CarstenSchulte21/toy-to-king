id: streife
name: Frau Brandt
role: Streife
room: strasse
hotspot: brandt
trust: false

dialogue:
  start:
    - if: [{ wanted_min: 2 }]
      node: gesucht
    - if: [{ wanted_min: 1 }]
      node: abtasten
    - if: [{ flag: brandt_misstrauisch }]
      node: misstrauisch
    - if: [{ phase: nacht }]
      node: nachts
    - if: [{ flag: brandt_kennt_dich }]
      node: wieder_da
    - node: erstes_mal

  nodes:
    erstes_mal:
      text: "Na. Alles gut bei dir?"
      effects:
        - set_flag: brandt_kennt_dich
      options:
        - text: "Ja, alles gut. Lange Schicht?"
          id: frag_schicht_erst
          once: true
          next: schicht
        - text: "Ich hab nichts gemacht!"
          next: nervoes
        - text: "Muss weiter."
          end: true

    schicht:
      text:
        - "Nachtschicht. Die dritte diese Woche."
        - "Um zwei bin ich wieder unten in der Unterführung. Da ist nachts immer was los."
      effects:
        - learn: streife_zwei
      options:
        - text: "Klingt anstrengend."
          next: anstrengend
        - text: "Was ist denn da unten los?"
          next: nachfragen

    anstrengend:
      text: "Man gewöhnt sich dran. Na dann."
      end: true

    nachfragen:
      text:
        - "Das Übliche. Frische Farbe an den Wänden."
        - "Aber das interessiert dich ja bestimmt nicht."
      end: true

    nervoes:
      text:
        - "Hab ich auch nicht behauptet."
        - "Aber jetzt merk ich mir dein Gesicht."
      effects:
        - set_flag: brandt_misstrauisch
      end: true

    misstrauisch:
      text: "Du schon wieder. Ich hab dich im Blick."
      end: true

    nachts:
      text:
        - "Sie stellt den Pappbecher aufs Dach vom Wagen."
        - '„Spät für dein Alter."'
      effects:
        - set_flag: brandt_kennt_dich
      options:
        - text: "Kann nicht schlafen."
          next: nicht_schlafen
        - text: "Ist doch noch früh."
          next: noch_frueh
        - text: "Muss weiter."
          end: true

    nicht_schlafen:
      text:
        - '„Kenn ich. Ich auch nicht, nur werde ich dafür bezahlt."'
        - "Sie guckt die Ladenzeile runter, bis zur Unterführung."
        - '„Geh nach Hause, ja?"'
      end: true

    noch_frueh:
      text:
        - '„Für mich fängt es jetzt erst an."'
        - '„Und wenn hier gleich einer mit einer Dose um die Ecke kommt, bin ich in zwei Minuten da."'
      end: true

    abtasten:
      text:
        - "Sie guckt dich zwei Sekunden zu lange an."
        - '„Zeig mal deine Hände."'
      options:
        - text: "Warum?"
          next: haende
        - text: "Nö."
          next: noe

    haende:
      text:
        - '„Schwarz unterm Daumennagel."'
        - '„Ich sag ja nichts. Ich guck nur."'
      end: true

    noe:
      text:
        - '„Muss ich auch nicht. Ich hab sie ja schon gesehen."'
      end: true

    gesucht:
      text:
        - "Diesmal lächelt sie nicht."
        - '„{name}."'
        - '„Ja, wir kennen den Namen. Steht auf genug Wänden."'
      options:
        - text: "Ich weiß nicht, wovon Sie reden."
          next: leugnen
        - text: "Und jetzt?"
          next: und_jetzt

    leugnen:
      text: '„Natürlich nicht."'
      end: true

    und_jetzt:
      text:
        - '„Jetzt gar nichts. Ich hab dich nicht dabei erwischt."'
        - '„Mach nur nicht den Fehler zu denken, dass das so bleibt."'
      end: true

    wieder_da:
      text: "Na. Alles ruhig?"
      options:
        - text: "Alles ruhig. Wieder Nachtschicht?"
          id: frag_schicht
          once: true
          if: [{ not_fact: streife_zwei }]
          next: schicht
        - text: "Alles ruhig."
          end: true
