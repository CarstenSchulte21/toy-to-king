id: abstellgleis
name: Abstellgleis
background: abstellgleis.png
description: "Hinter dem Zaun. Schotter, abgestellte Waggons, kein Mensch zu sehen."
hotspots:
  - id: waggon
    label: Waggon
    rect: [40, 50, 200, 80]
    sprühen: abstellgleis
    untersuchen:
      - if: [{sprayed: abstellgleis}]
        text: "Dein Werk auf dem Waggon. Wenn der losfährt, fährt dein Name mit."
      - text:
          - "Ein abgestellter Waggon. Die Seite ist fast leer."
          - "Nur ein paar alte Tags, halb abgewaschen."

  - id: waggontuer
    label: Waggontür
    rect: [130, 96, 20, 36]
    sprühen: waggontuer
    untersuchen: "Die Schiebetür ist lackiert und glatt. Darauf hält keine Dose, aber ein Marker schon."

  - id: gleise
    label: Gleise
    rect: [250, 120, 60, 50]
    untersuchen:
      - if: [{not_flag: fund_gleise}]
        text:
          - "Die Gleise glänzen. Hier fährt nachts noch was."
          - "Zwischen zwei Schwellen liegt ein NY Fat im Schotter. Jemand hatte es eilig."
        effects:
          - set_flag: fund_gleise
          - give: ny_fat
      - text: "Die Gleise glänzen. Hier fährt nachts noch was."

  - id: zurueck
    label: Zurück durch den Zaun
    rect: [0, 60, 20, 110]
    gehen: unterfuehrung
