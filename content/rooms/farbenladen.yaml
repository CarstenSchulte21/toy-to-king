id: farbenladen
name: Graffitistore
background: farbenladen.png
description: "Regale bis unter die Decke, Dosen nach Farben sortiert. Riecht nach Lack."
hotspots:
  - id: regal_low
    label: Regal Low Pressure
    rect: [10, 20, 80, 120]
    untersuchen:
      - if: [{ not_flag: fund_regal_low }]
        text:
          - "Low Pressure. Dutzende Farbtöne, jeder mit eigenem Namen."
          - "Ganz hinten, zwischen zwei Reihen, steht eine Dose mit einer Beule im Boden."
          - 'Du hältst sie hoch. Sibel guckt kurz rüber: „Die verkauf ich nicht mehr. Nimm mit."'
        effects:
          - set_flag: fund_regal_low
          - give: farbe_schwarz
      - text: "Low Pressure. Dutzende Farbtöne, jeder mit eigenem Namen."

  - id: regal_high
    label: Regal High Pressure
    rect: [95, 20, 60, 120]
    untersuchen:
      - if: [{ not_flag: fund_regal_high }]
        text:
          - "High Pressure. Weniger Farben, mehr Druck. Das Regal fürs Bombing."
          - "Auf dem Brett liegt ein Cap, das jemand aufgemacht und wieder hingelegt hat."
          - "Du steckst es ein. Sibel sieht es und sagt nichts."
        effects:
          - set_flag: fund_regal_high
          - give: standard_cap
      - text: "High Pressure. Weniger Farben, mehr Druck. Das Regal fürs Bombing."

  - id: capkiste
    label: Cap-Kiste
    rect: [170, 110, 40, 25]
    untersuchen:
      - "Eine Kiste voller Caps, sortiert in kleine Fächer: Skinny, Soft, Fat, NY Fat."
      - "Daneben ein Zettel: Nicht einfach mitnehmen. Fragen."

  - id: pinnwand
    label: Pinnwand
    rect: [220, 25, 50, 50]
    untersuchen:
      - if: [{ not_fact: hall }]
        text:
          - "Ein Flyer für eine Jam im Jugendzentrum. Das Datum ist schon vorbei."
          - "Darunter, halb verdeckt: Legale Wand – Anmeldung im Jugendzentrum."
          - "Unten steht eine Adresse. Alte Feuerwache, zwei Straßen weiter. Das steht jetzt auf deiner Karte."
        effects:
          - learn: hall
      - text:
          - "Ein Flyer für eine Jam im Jugendzentrum. Das Datum ist schon vorbei."
          - "Darunter, halb verdeckt: Legale Wand – Anmeldung im Jugendzentrum."

  - id: sibel
    label: Frau an der Theke
    rect: [240, 85, 35, 70]
    untersuchen: "Hinter der Theke sortiert eine Frau Caps. Sie sieht kurz hoch und nickt."
    sprechen: laden
    kaufen: true

  - id: raus
    label: Zur Straße
    rect: [290, 60, 30, 100]
    gehen: strasse
