id: hinterhof
name: Hinterhof
background: hinterhof.png
description: "Hinterhof. Hier hat alles angefangen: drei Mülltonnen und ein Edding."
hotspots:
  - id: muelltonnen
    label: Mülltonnen
    rect: [20, 110, 70, 50]
    sprühen: muelltonnen
    untersuchen:
      - if: [{not_flag: fund_tonne}]
        text:
          - "Du kippst die mittlere Tonne an. Unten drin klappert was."
          - "Eine Dose Chrom, halb voll. Jemand hat sie weggeworfen, statt sie leer zu machen."
          - "Dessen Problem."
        effects:
          - set_flag: fund_tonne
          - give: farbe_chrom
      - if: [{sprayed: muelltonnen}]
        text: "Der neue Handstyle sitzt. Die erste Tonne von links will trotzdem keiner mehr sehen."
      - text:
          - "Drei Tonnen, alle mit deinem Tag drauf."
          - "Von links nach rechts wird der Handstyle besser. Die erste Tonne will keiner mehr sehen."
          - "Auf der mittleren ist noch Platz."

  - id: rolltor
    label: Garagentor
    rect: [110, 60, 90, 90]
    untersuchen:
      - if: [{fact: buff_montag}]
        text: "Grau. Wie alles hier nach einem Montag."
      - text:
          - "Garagentor. Früher war hier ein Piece, jetzt ist da ein grauer Fleck."
          - "Durch den Buff sieht man noch die Umrisse der Buchstaben. Das war mal ein Burner."

  - id: feuerleiter
    label: Feuerleiter
    rect: [215, 20, 30, 120]
    untersuchen:
      - "Die Feuerleiter endet zwei Meter über dem Boden."
      - "Oben, direkt unterm Dach, ist die Wand komplett frei. Noch."

  - id: stromkasten
    label: Stromkasten
    rect: [255, 100, 30, 45]
    sprühen: stromkasten
    untersuchen:
      - if: [{not_flag: fund_kasten}]
        text:
          - "Stromkasten voller Sticker. Ein paar Namen kennst du. Die meisten nicht."
          - "Einer taucht überall auf: KRUX. Sauberer Handstyle, das muss man ihm lassen."
          - "Hinter dem Kasten, zwischen Wand und Blech, klemmt ein Skinny Cap. Staubig, aber heil."
        effects:
          - set_flag: fund_kasten
          - give: skinny_cap
      - text:
          - "Stromkasten voller Sticker. Ein paar Namen kennst du. Die meisten nicht."
          - "Einer taucht überall auf: KRUX. Sauberer Handstyle, das muss man ihm lassen."

  - id: kalle
    label: Mann auf der Kiste
    rect: [150, 105, 30, 55]
    untersuchen:
      - "Ein älterer Typ auf einer Getränkekiste. Blackbook auf dem Knie, Kaffee daneben."
      - "Er zeichnet, ohne aufzusehen."
    sprechen: mentor

  - id: durchgang
    label: Durchgang
    rect: [295, 60, 25, 100]
    untersuchen: "Der Durchgang zur Straße."
    gehen: strasse
