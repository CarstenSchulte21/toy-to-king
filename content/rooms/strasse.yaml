id: strasse
name: Straße
background: strasse.png
description: "Die Ladenzeile. Kiosk, Handyladen, der Graffitistore. Und eine Streife, die hier öfter steht als der Bus."
hotspots:
  - id: rolltore
    label: Rolltore
    rect: [40, 60, 90, 80]
    sprühen: rolltore
    untersuchen:
      - if: [{sprayed: rolltore}]
        text: "Zwischen all den Tags: deiner. Mal sehen, wie lange er hält."
      - if: [{fact: buff_montag}]
        text: "Alle drei Rolltore frisch grau. Montag war Buff-Tag."
      - text:
          - "Drei Rolltore, alle voll mit Tags."
          - "Dazwischen graue Flecken. Irgendwer räumt hier regelmäßig auf."

  - id: laterne
    label: Laternenmast
    rect: [140, 20, 16, 130]
    untersuchen: "Sticker über Sticker. KRUX klebt ganz oben. Wie ist er da hochgekommen?"

  - id: kamera
    label: Kamera
    rect: [200, 28, 20, 16]
    if: [{fact: kamera}]
    untersuchen: "Die neue Kamera über dem Graffitistore. Sie zeigt genau auf die Rolltore."

  - id: brandt
    label: Polizistin
    rect: [240, 90, 30, 70]
    untersuchen: "Eine Polizistin lehnt am Streifenwagen und trinkt Kaffee aus einem Pappbecher."
    sprechen: streife

  - id: nowak
    label: Mann in oranger Jacke
    rect: [92, 96, 34, 60]
    if: [{weekday: mo}, {not_phase: nacht}]
    untersuchen: "Ein Reinigungswagen steht auf dem Gehweg. Der Schlauch liegt quer über den Bordstein."
    sprechen: buff

  - id: zum_hinterhof
    label: Hinterhof
    rect: [0, 60, 20, 100]
    gehen: hinterhof

  - id: zum_laden
    label: Graffitistore
    rect: [180, 50, 50, 90]
    if: [{not_phase: nacht}]
    untersuchen: "Durch die Scheibe siehst du die Regale. Sibel sortiert irgendwas ein."
    gehen: farbenladen

  - id: laden_zu
    label: Graffitistore (zu)
    rect: [180, 50, 50, 90]
    if: [{phase: nacht}]
    untersuchen:
      - "Rollladen runter, Licht aus. Steht ein Zettel dran: ab zehn Uhr."
      - "Was du heute Nacht nicht dabei hast, hast du heute Nacht nicht."

  - id: zur_unterfuehrung
    label: Unterführung
    rect: [290, 70, 30, 90]
    gehen: unterfuehrung
