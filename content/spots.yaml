- id: rolltore
  name: den Rolltoren
  type: rolltor
  room: strasse
  hotspot: rolltore
  fits: [tag, straight, bubble]
  fit_hint: "Die Rolltore sind für schnelle Sachen. Für mehr hast du hier keine Ruhe."
  risk: mittel
  risk_mod:
    - if: [{ not_phase: nacht }]
      by: 0.35
      hint: "Zehn Meter weiter steht die Streife und guckt in deine Richtung."
    - if: [{ phase: nacht }]
      by: 0.15
      hint: "Die Streife sitzt im Wagen und guckt aufs Handy. Weg ist sie trotzdem nicht."
    - if: [{ phase: nacht }, { flag: licht_aus }]
      by: -0.2
      hint: "Die Laterne ist aus. Vom Wagen aus bist du ein Schatten."

