# Auftragsarbeit (M5b): Hakans Lager im Hinterhof. Legal in dem Sinn, dass der Besitzer
# es selbst will – und deshalb ohne Risiko, aber auch ohne den Reiz des Verbotenen.
- id: doener_rolltor
  name: Hakans Tor
  type: rolltor
  room: hinterhof
  hotspot: rolltor
  fits: [bubble, bombing, piece]
  fit_hint: "Für ein Tor in dieser Größe ist das zu klein. Er zahlt für was, das man sieht."
  risk: kein
  if: [{ fact: auftrag }]
  risk_mod:
    - if: [{ fact: auftrag }]
      by: -1
      hint: "Der Besitzer will das hier. Zum ersten Mal musst du nicht gucken, wer kommt."

